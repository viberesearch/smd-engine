# The classic two boards: org-activity and object-ontological, the "double
# work with schemes" of the games (GP-SMD; GP1983; GP1987;
# docs/method/reconciliation.md, section 1). No situation board.
# Format: docs/profiles.md.
id: classic-two-boards
title:
  ru: Две доски классики
  en: The classic two boards
boards:
  - id: od
    label: {ru: Оргдеятельностная доска, en: Org-activity board}
    short: {ru: ОД доска, en: OA board}
    halves: none
    region: [60, 150, 780, 850]
    colour: ["#eef4f1", "#2e7d62"]
  - id: oo
    label: {ru: Объектно-онтологическая доска, en: Object-ontological board}
    short: {ru: ОО доска, en: OO board}
    halves: none
    region: [820, 150, 1540, 850]
    colour: ["#f3f4fb", "#5c63b8"]
    object: true
# In layout order: a region places its items kind by kind in this order.
kinds:
  - {id: position, label: {ru: позиции, en: positions}, label_one: {ru: позиция, en: position}, home: od, needs_position: false, container: false, role: true, scheme: false, shape: figure, skeleton: true, stance: true}
  - {id: reflexive_position, label: {ru: рефлексивные позиции, en: reflexive positions}, label_one: {ru: рефлексивная позиция, en: reflexive position}, home: od, needs_position: false, container: false, role: true, scheme: false, shape: figure, skeleton: true, stance: true}
  - {id: goal, label: {ru: цели, en: goals}, label_one: {ru: цель, en: goal}, home: od, needs_position: true, container: false, role: false, scheme: false, shape: box, skeleton: false}
  - {id: place_for_others, label: {ru: места для других, en: places for others}, label_one: {ru: место для других, en: place for others}, home: od, needs_position: false, container: false, role: true, scheme: false, shape: ellipse, skeleton: false}
  - {id: frame, label: {ru: рамки, en: frames}, label_one: {ru: рамка, en: frame}, home: oo, needs_position: true, container: true, role: false, scheme: true, shape: frame, skeleton: true}
  - {id: standard, label: {ru: стандарты, en: standards}, label_one: {ru: стандарт, en: standard}, home: oo, needs_position: true, container: false, role: false, scheme: true, shape: box, skeleton: false}
  - {id: norm, label: {ru: нормы, en: norms}, label_one: {ru: норма, en: norm}, home: oo, needs_position: true, container: false, role: false, scheme: true, shape: box, skeleton: false}
  - {id: model, label: {ru: модели, en: models}, label_one: {ru: модель, en: model}, home: oo, needs_position: true, container: false, role: false, scheme: true, shape: box, skeleton: false}
  - {id: concept, label: {ru: понятия, en: concepts}, label_one: {ru: понятие, en: concept}, home: oo, needs_position: true, container: false, role: false, scheme: true, shape: box, skeleton: false}
  - {id: function, label: {ru: функции, en: functions}, label_one: {ru: функция, en: function}, home: oo, needs_position: false, container: true, role: false, scheme: true, shape: box, skeleton: true}
  - {id: cooperation, label: {ru: кооперации, en: cooperations}, label_one: {ru: кооперация, en: cooperation}, home: oo, needs_position: false, container: false, role: false, scheme: true, shape: box, skeleton: false}
  - {id: other, label: {ru: прочее, en: other}, label_one: {ru: прочее, en: other}, home: null, needs_position: false, container: true, role: false, scheme: false, shape: box, skeleton: false}
  - {id: note, label: {ru: заметки, en: notes}, label_one: {ru: заметка, en: note}, home: null, needs_position: false, container: false, role: false, scheme: false, shape: box, skeleton: false, light_off: true}
  - {id: gap, label: {ru: разрывы, en: gaps}, label_one: {ru: разрыв, en: gap}, home: null, needs_position: false, container: false, role: true, scheme: false, shape: question, skeleton: false}
relations: [shift, flow, produces, uses, belongs, opposes, refers, represents, other]
# No entry kind, no situation board: the hints on them are off.
hints:
  - empty-boards
  - positions
  - new-frames
  - gaps
  - open-qualifications
  - candidate-moves
  - problems
  - belts
  - ontology
  - ontology-outlives-pace
  - difficulty
  - revise-if
  - hypothesis-type
  - hypothesis-rule
  - rule-basis
  - rule-n-min
  - type-status
  - verdict
  - ai-drafts
  - ai-variants
  - no-new-scheme
  # Gates Ш8-Ш12 (GP-Guide11 «Программа действий»; GP-T5)
  - object-from-inside
  - external-without-reflection
  - goal-without-breakdown
  - position-without-object
  - ought-without-fact
  - design-the-natural
  - information-without-cell
  - cells-from-information
  # Method review 31.10.2026: board density, the empty places of a functional
  # plan, the self-checks of the ontology procedures (docs/checks.md)
  - board-dense
  - function-flows
  - unlinked-functions
  - idle-positions
  # AI on the boards, gate ИИ1 Б (validate/ai.py)
  - ai-decision-unanswered
  - red-line-without-value
  - red-line-outlives-pace
  - red-line-breach
  - red-line-expired
  - ai-cooperation
  - cooperation-flows
  - translation-loss
# Not matched by smd compare.
compare_skip: [note]
compare_groups:
  positions: [position, reflexive_position, place_for_others]
  frames: [frame]
  functions: [function, cooperation]
  institutions: [standard, norm, model, concept]
  gaps: [gap]
reading:
  - {step: positions, board: od, pick: {board: od, kinds: [position, reflexive_position, goal]}}
  - {step: places, board: od, pick: {board: od}}
  - {step: old-frame, board: oo, pick: old-frames}
  - {step: new-frame, board: oo, pick: new-frames}
  - {step: object, board: oo, pick: {board: oo}}
