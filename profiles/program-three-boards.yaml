# The program's screen (Girenko, day 4, 17.10.2026): org-activity board top
# left, object board top right, situation board at the bottom, split into a
# small (left) and a big (right) half. The default profile of every record.
# Format: docs/profiles.md.
id: program-three-boards
# Two boards on top, the third below them, drawn as the organisers' triangles.
screen: triangles
title:
  ru: Три доски программы
  en: The program's three boards
boards:
  - id: od
    label: {ru: Оргдеятельностная доска, en: Org-activity board}
    short: {ru: ОД доска, en: OA board}
    halves: none
    region: [60, 150, 780, 430]
    colour: ["#eef4f1", "#2e7d62"]
  - id: oo
    label: {ru: Объектная доска, en: Object board}
    short: {ru: объектная, en: object}
    halves: none
    region: [820, 150, 1540, 430]
    colour: ["#f3f4fb", "#5c63b8"]
    object: true
  - id: s
    label: {ru: Ситуационная доска, en: Situation board}
    short: {ru: ситуационная, en: situation board}
    halves: [small, big]
    region: [445, 625, 1160, 850]
    split: 800  # the halves meet under the apex of the triangles
    colour: ["#f5eee2", "#a8782a"]
# In layout order: a region places its items kind by kind in this order.
kinds:
  - {id: entry, label: {ru: вход, en: entry}, label_one: {ru: вход, en: entry}, home: null, needs_position: false, container: false, role: false, scheme: false, shape: marker, skeleton: true}
  - {id: position, label: {ru: позиции, en: positions}, label_one: {ru: позиция, en: position}, home: od, needs_position: false, container: false, role: true, scheme: false, shape: figure, skeleton: true, stance: true}
  - {id: goal, label: {ru: цели, en: goals}, label_one: {ru: цель, en: goal}, home: od, needs_position: true, container: false, role: false, scheme: false, shape: box, skeleton: false}
  - {id: place_for_others, label: {ru: места для других, en: places for others}, label_one: {ru: место для других, en: place for others}, home: od, needs_position: false, container: false, role: true, scheme: false, shape: ellipse, skeleton: false}
  - {id: frame, label: {ru: рамки, en: frames}, label_one: {ru: рамка, en: frame}, home: oo, needs_position: true, container: true, role: false, scheme: true, shape: frame, skeleton: true}
  - {id: standard, label: {ru: стандарты, en: standards}, label_one: {ru: стандарт, en: standard}, home: oo, needs_position: true, container: false, role: false, scheme: true, shape: box, skeleton: false}
  - {id: model, label: {ru: модели, en: models}, label_one: {ru: модель, en: model}, home: oo, needs_position: true, container: false, role: false, scheme: true, shape: box, skeleton: false}
  - {id: concept, label: {ru: понятия, en: concepts}, label_one: {ru: понятие, en: concept}, home: oo, needs_position: true, container: false, role: false, scheme: true, shape: box, skeleton: false}
  - {id: function, label: {ru: функции, en: functions}, label_one: {ru: функция, en: function}, home: oo, needs_position: false, container: true, role: false, scheme: true, shape: box, skeleton: true}
  - {id: cooperation, label: {ru: кооперации, en: cooperations}, label_one: {ru: кооперация, en: cooperation}, home: oo, needs_position: false, container: false, role: false, scheme: true, shape: box, skeleton: false}
  - {id: situation, label: {ru: ситуации, en: situations}, label_one: {ru: ситуация, en: situation}, home: s, needs_position: true, container: true, role: false, scheme: false, shape: heading, skeleton: true}
  - {id: normality_boundary, label: {ru: границы нормальности, en: boundaries of normality}, label_one: {ru: граница нормальности, en: boundary of normality}, home: s, needs_position: true, container: false, role: false, scheme: false, shape: paragraph, skeleton: false}
  - {id: fact, label: {ru: факты, en: facts}, label_one: {ru: факт, en: fact}, home: s, needs_position: true, container: false, role: false, scheme: false, shape: paragraph, skeleton: false, light_off: true, factual: true}
  - {id: signal, label: {ru: сигналы, en: signals}, label_one: {ru: сигнал, en: signal}, home: s, needs_position: true, container: false, role: false, scheme: false, shape: paragraph, skeleton: false, light_off: true}
  - {id: garland, label: {ru: серии связанных событий, en: series of linked events}, label_one: {ru: серия связанных событий, en: series of linked events}, home: s, needs_position: true, container: true, role: false, scheme: false, shape: paragraph, skeleton: false}
  - {id: vision, label: {ru: визионеры, en: visionaries}, label_one: {ru: визионер, en: visionary}, home: s, needs_position: true, container: false, role: false, scheme: false, shape: paragraph, skeleton: false}
  - {id: other, label: {ru: прочее, en: other}, label_one: {ru: прочее, en: other}, home: null, needs_position: false, container: true, role: false, scheme: false, shape: paragraph, skeleton: false}
  - {id: note, label: {ru: заметки, en: notes}, label_one: {ru: заметка, en: note}, home: null, needs_position: false, container: false, role: false, scheme: false, shape: paragraph, skeleton: false, light_off: true}
  - {id: gap, label: {ru: разрывы, en: gaps}, label_one: {ru: разрыв, en: gap}, home: null, needs_position: false, container: false, role: true, scheme: false, shape: question, skeleton: false}
relations: [shift, flow, produces, uses, belongs, opposes, refers, represents, other]
