# Not matched by smd compare.
compare_skip: [entry, note]
compare_groups:
  positions: [position, place_for_others]
  frames: [frame]
  functions: [function, cooperation]
  institutions: [standard, model, concept]
  situation: [situation, fact, signal, normality_boundary, garland, vision]
  gaps: [gap]
# The organisers' order of reading a screen: each step, the board (or half) a
# zoomed step is cut to, and what the step adds.
reading:
  - {step: entry, board: od, pick: {kinds: [entry]}}
  - {step: positions, board: od, pick: {board: od, kinds: [position, goal]}}
  - {step: places, board: od, pick: {board: od}}
  - {step: small, board: s.small, pick: {board: s, half: small}}
  - {step: big, board: s.big, pick: {board: s}}
  - {step: old-frame, board: oo, pick: old-frames}
  - {step: new-frame, board: oo, pick: new-frames}
  - {step: object, board: oo, pick: {board: oo}}
# SessionFlow frame 03, section 1: what each of the first three questions draws on.
sessionflow:
  who: [{kinds: [position]}, {kinds: [situation, fact], board: s, half: small}]
  where: [{kinds: [place_for_others]}, {kinds: [situation, signal], board: s, half: big}]
  what_for: [{kinds: [frame], frame_state: new}, {kinds: [function]}]
