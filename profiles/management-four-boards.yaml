compare_skip: [note]
compare_groups:
  positions: [position, reflexive_position, place_for_others]
  upper: [knowledge_retro, knowledge_projective, ideal_state, programme, means, functional_place, model, concept, algedonic_channel]
  processes: [function, cooperation, work_process]
  apparatus: [post, group, club]
  managed: [monosystem, mission, self_motion, trajectory, functional_structure, link_structure, morphology, material, fact]
  gaps: [gap]
reading:
