name: Release

# Builds the sdist and the wheel when a version tag is pushed and publishes
# them to PyPI through a trusted publisher (OIDC; no token is stored). The owner
# creates the PyPI project once and registers this repository, workflow file
# (release.yml) and environment (pypi) as its trusted publisher.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Set up Python
        run: uv python install

      - name: Tag matches the version in pyproject.toml
        run: |
          version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version ${version}" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    # Releases come from the public repository only; in the private development
    # repository a tag builds and checks the distributions but publishes nothing.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/smd-engine/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
