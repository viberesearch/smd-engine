[project]
name = "smd-engine"
version = "0.5.9"
description = "Records, checks and renderings for SMD-style thinking sessions (three boards, cycles, qualifications)"
readme = "README.md"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE"]
authors = [{ name = "viberesearch" }]
keywords = ["smd", "shchedrovitsky", "methodology", "thinking-session", "yaml", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Natural Language :: Russian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup",
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "jsonschema>=4.21",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/viberesearch/smd-engine"
Repository = "https://github.com/viberesearch/smd-engine"
Issues = "https://github.com/viberesearch/smd-engine/issues"
Changelog = "https://github.com/viberesearch/smd-engine/blob/main/CHANGELOG.md"

[project.scripts]
smd = "smd_engine.cli:main"

[dependency-groups]
dev = [
    "black>=26.3.1",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "types-pyyaml",
    "types-jsonschema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Four tracked symlinks (.clinerules, .cursorrules, .cursorignore, .rooignore)
# point at an absolute path outside the repository, which tar refuses; they
# are the owner's tooling, not part of the package.
[tool.hatch.build.targets.sdist]
exclude = [".clinerules", ".cursorrules", ".cursorignore", ".rooignore"]

[tool.hatch.build.targets.wheel]
packages = ["src/smd_engine"]

[tool.hatch.build.targets.wheel.force-include]
"procedures" = "smd_engine/assets/procedures"
"profiles" = "smd_engine/assets/profiles"
"roles" = "smd_engine/assets/roles"
"lenses" = "smd_engine/assets/lenses"
"docs/data-model.md" = "smd_engine/assets/data-model.md"
"docs/checks.md" = "smd_engine/assets/checks.md"

[tool.black]
target-version = ["py314"]
extend-exclude = '''
/(
    \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--strict-markers --cov=smd_engine --cov-report=term-missing"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["tests/"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]
