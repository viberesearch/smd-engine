# предприятие; всё остальное придумано и помечено lineage: [fictional], voice: ai.
# Доски собраны по шести уровням OST (замысел, модель, юрлицо и права, продукт,
# процесс, организация): теги tier. Уровни L0-L5 спецификации не те же самые: см. README.md.
