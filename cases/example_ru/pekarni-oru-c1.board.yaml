  - {id: tr-natural, board: us, kind: trajectory, label: "каждая пекарня сама сокращает ночь",
     in: [mono-people], seen_from: p-organiser, modality: fact, nature: natural}
  - {id: tr-ought, board: us, kind: trajectory, label: "ночной замес уходит в общий цех",
