  - {id: wp-dough, board: us, kind: work_process, label: "ночной замес теста", in: [mono-tech],
     seen_from: p-organiser}
  - {id: wp-delivery, board: us, kind: work_process, label: "доставка теста в пекарни",
     in: [mono-tech], seen_from: p-organiser}
  - {id: pl-functions, board: us, kind: functional_structure, label: "смены и их участки",
     in: [mono-tech], seen_from: p-organiser}
  - {id: pl-links, board: us, kind: link_structure, label: "кто кому передаёт тесто",
     in: [mono-tech], seen_from: p-organiser}
  - {id: pl-morphology, board: us, kind: morphology, label: "печи и график смен", in: [mono-tech],
     seen_from: p-organiser}
  - {id: pl-material, board: us, kind: material, label: "мука, вода, дрожжи", in: [mono-tech],
     seen_from: p-organiser}
  - {id: f-night, board: us, kind: fact, label: "ночная смена стоит треть фонда оплаты труда",
