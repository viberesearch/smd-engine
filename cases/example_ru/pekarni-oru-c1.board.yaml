  - {id: grp-bakers, board: ap, kind: group, label: "пекари ночной смены"}
  - {id: club-assoc, board: ap, kind: club, label: "клуб ассоциации пекарен"}
  # Управляемая полисистема: моносистемы, миссия, процессы, траектории, факты
  - {id: mono-people, board: us, kind: monosystem, label: "система людей: пекари трёх пекарен",
