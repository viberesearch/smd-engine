# Доски процессов: каждая — отдельная доска (шаблон process профиля), под четырьмя
boards:
  - {id: pb-dough, template: process, label: "ночной замес теста", seen_from: p-organiser,
     unfolds: wp-dough}
  - {id: pb-delivery, template: process, label: "доставка теста в пекарни",
     seen_from: p-organiser, unfolds: wp-delivery}
elements:
  # Оргдеятельностная доска: позиции и их самоопределение
  - {id: p-organiser, board: od, kind: position, label: "организатор общего производства",
