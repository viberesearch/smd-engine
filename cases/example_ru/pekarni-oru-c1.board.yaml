# Выдуманный учебный пример на схеме ОРУ Г.П. Щедровицкого (профиль
# management-four-boards): пекарни из cases/example_ru, где организатор общего
# производства управляет ночным замесом теста. Все четыре доски заполнены;
# каждый рабочий процесс идеализирован на отдельной доске процесса (`boards`).
record: board_set
schema_version: "0.3"
id: pekarni-oru-c1
