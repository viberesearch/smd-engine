  - {id: fn-mix, board: pb-dough, kind: function, label: "замес"}
  - {id: fn-proof, board: pb-dough, kind: function, label: "расстойка"}
  - {id: fn-hand-over, board: pb-dough, kind: function, label: "передача теста водителю"}
