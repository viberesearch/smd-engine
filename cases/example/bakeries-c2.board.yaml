# Invented teaching example, cycle 2: the group reflects on session 1,
# ingests session 2 as theses, and signs off what it accepts.
record: board_set
schema_version: "0.3"
id: bakeries-c2
case: example-bakeries
title: Bakeries, screen after session 2
date: "2026-01-17"
cycle: 2
revises: bakeries-c1
reflected_from: p-reflect
status: draft
sources: [s1, s3, s4]
elements:
  - {id: entry, board: od, kind: entry, label: entry}
  - {id: p-owner, board: od, kind: position, label: "owner of three bakeries"}
  - {id: p-organiser, board: od, kind: position, label: "organiser of shared production",
     epistemic: hypothesis}
  - {id: p-reflect, board: od, kind: position, label: "the group looking back at session 1"}
  - {id: place-mills, board: od, kind: place_for_others, label: "regional mills"}
  - {id: place-bank, board: od, kind: place_for_others, label: "bank: equipment leasing"}
  - {id: f-old, board: oo, kind: frame, frame_state: old, label: "old frame: retail bakery",
     seen_from: p-owner}
  - {id: f-new, board: oo, kind: frame, frame_state: new,
     label: "new frame: shared production for independent bakeries", seen_from: p-organiser,
     cites: ["s1#t=00:31:00"]}
  - {id: fn-dough, board: oo, kind: function, label: "dough production, paid per tonne by members",
     in: [f-new], seen_from: p-organiser, performed_by: p-organiser, cites: ["s3#t=00:14:20"],
     ai: assists, label_note: "the night's volume is planned from members' orders with an AI demand forecast; the organiser decides"}
  - {id: fn-logistics, board: oo, kind: function, label: "night logistics, run by the plant",
     in: [f-new], seen_from: p-organiser, performed_by: p-organiser}
  - id: m-coop
    board: oo
    kind: model
    label: "model from another domain: dairy cooperatives"
    seen_from: p-organiser
    voice: ai
    move: {op: glue, from: [f-new], via: "shared asset owned by producers", status: accepted}
  - {id: coop-plant, board: oo, kind: cooperation,
     label: "members order, the plant bakes dough, mills supply flour"}
  - {id: s-small, board: s, half: small, kind: situation, label: "three bakeries, flat sales",
     seen_from: p-owner}
  - {id: s-big, board: s, half: big, kind: situation, label: "independent bakeries close",
     seen_from: p-organiser}
  - {id: gap-risk, board: oo, kind: gap, label: "who carries unsold dough?", of: position}
  # A red line the owner sets for the pilot season (gate КЛ1 В, docs/red-lines.md); no
  # observations yet: the nightly reports start with the plant.
  - id: rl-unsold
    board: oo
    kind: standard
    label: "unsold dough stays at most 5% of the night's volume"
    seen_from: p-owner
    red_line: true
    line: {metric: "unsold dough, share of the night's volume", unit: "%", max: 5,
           since: "2026-03-01", until: "2027-02-28", recovery_days: 14}
relations:
  - {from: p-owner, to: p-organiser, kind: shift, label: "other position"}
  - {from: p-owner, to: f-old, kind: represents}
  - {from: place-mills, to: fn-dough, kind: flow, carries: material, label: "flour"}
  - {from: p-owner, to: fn-dough, kind: flow, carries: money, label: "pays per tonne"}
  - {from: rl-unsold, to: fn-dough, kind: refers, label: "the night's volume is planned inside the line"}
  - {from: rl-unsold, to: p-owner, kind: flow, carries: information, label: "the nightly report goes to the owner, who set the line"}
  - {from: fn-dough, to: fn-logistics, kind: flow, carries: product, label: "dough to deliver"}
  - {from: p-owner, to: fn-logistics, kind: flow, carries: money, label: "pays inside the dough price, for now"}
  - {from: fn-logistics, to: p-owner, kind: flow, carries: product, label: "dough before four in the morning"}
  - {from: p-owner, to: coop-plant, kind: flow, carries: information, label: "orders dough, pledges a volume"}
  - {from: coop-plant, to: p-owner, kind: flow, carries: product, label: "dough at a lower cost than the night shift"}
  - {from: p-organiser, to: coop-plant, kind: flow, carries: product, label: "dough and delivery"}
  - {from: coop-plant, to: p-organiser, kind: flow, carries: money, label: "paid by use against the pledged volume"}
transitions:
  - {n: 1, from: p-reflect, to: f-new, label: "what session 1 left without a payer"}
  - {n: 2, from: f-new, to: s-big}
qualifications:
  - {id: K1, targets: [p-organiser], text: "the move to the organiser position is a hypothesis",
     by: methodologist, status: open, raised_in: 1}
  - {id: K2, targets: [f-new], text: "functions are not tied to who performs and who pays",
     by: methodologist, status: closed, raised_in: 1, closed_in: 2}
theses:
  - id: T1
    claim: "The mills will not sign before they see a volume."
    grounds: "Two mill owners said so in interviews."
    next_move: "Collect a volume pledge from five bakeries."
    voice: group
    status: voiced
    belt: md
    kind: difficulty
    feeds: [place-mills]
    raises: [K1]
    cites: ["s3#t=00:08:10"]
  - id: T2
    claim: "The plant belongs to the bakeries that use it, like a dairy cooperative."
    voice: participant
    status: assumption
    belt: m
    kind: statement
    feeds: [m-coop]
    move: {op: glue, from: [f-new], via: "producer-owned shared asset", status: accepted}
    cites: ["s3#t=00:11:30"]
  - id: T3
    claim: "Nobody on the board carries the risk of unsold dough."
    voice: ai
    status: ai_variant
    belt: m
    kind: problem
    of: position
    feeds: [gap-risk]
    move: {op: adjoin, from: [f-new], via: "time: day-to-day demand", status: candidate}
  - id: T4
    claim: "Will the bank lease equipment to a cooperative with no history?"
    voice: ai
    status: refined
    belt: mk
    kind: question
    feeds: [place-bank]
    cites: ["s3#t=00:22:05"]
  - id: T5
    claim: "Price dough per tonne, so the plant is paid by use."
    voice: moderator
    status: proposal
    belt: mk
    kind: task
    feeds: [fn-dough]
    cites: ["s3#t=00:14:20"]
hypotheses:
  - id: H1
    assumes: "Five bakeries will pledge a weekly volume if dough costs less per tonne than their own."
    action: "Offer a pledge form to twelve bakeries."
    observe: "Number of signed pledges and the volumes."
    revise_if: "Fewer than five pledges."
    status: confirmed
    result: "Seven pledges, 4.2 tonnes a week in total."
    changes: "The mills get the volume they asked for (T1)."
    targets: [place-mills, fn-dough]
    artefacts: [s4]
    raised_in: 1
    resolved_in: 2
  - id: H2
    assumes: "The bank leases to a cooperative backed by member pledges."
    action: "Ask the bank with the pledges in hand."
    observe: "The bank's terms."
    revise_if: "The bank asks for collateral beyond the pledges."
    status: testing
    targets: [place-bank]
    raised_in: 2
ontology:
  - id: O1
    object: "shared production as an asset owned by the bakeries that use it"
    valid_for: [p-owner, p-organiser]
    subjects:
      - {position: p-owner, subject: "dough at a lower cost than our own night shift"}
      - {position: p-organiser, subject: "a plant paid by use, with a guaranteed volume"}
    cooperation: coop-plant
    competes: "the members' plant competes with the chains' central production"
    test: H1
signoffs:
  - {function: close_k, target: K2, by: group, cycle: 2, date: "2026-01-17",
     note: "dough and logistics now name who performs and who pays"}
  - {function: accept_move, target: m-coop, by: group, cycle: 2, date: "2026-01-17"}
  - {function: accept_thesis, target: T4, by: group, cycle: 2, date: "2026-01-17",
     note: "the group kept the question and added the leasing case"}
  - {function: accept_result, target: H1, by: group, cycle: 2, date: "2026-01-17",
     note: "pledge forms checked against the list of bakeries"}
state:
  version: "0.2"
  difficulty: "session 1 left the plant without a payer"
  accepted: ["K2 closed", "dairy cooperative as the model"]
  open: ["K1", "T3"]
  next_move: "ask the bank about leasing to a cooperative"
