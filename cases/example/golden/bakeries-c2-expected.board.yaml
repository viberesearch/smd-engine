    next_move: "Collect a volume pledge from five bakeries."
    voice: group
    status: voiced
    belt: md
    kind: difficulty
    feeds: [place-mills]
    cites: ["s3#t=00:08:10"]
  - id: T4
    claim: "The plant could belong to the bakeries that use it, like a dairy cooperative."
    voice: participant
    status: assumption
    belt: m
    kind: statement
    feeds: [m-coop]
    cites: ["s3#t=00:11:30"]
  - id: T5
    claim: "Price dough per tonne, so the plant is paid by use."
    voice: moderator
    status: proposal
    belt: mk
    kind: task
    feeds: [fn-dough]
    cites: ["s3#t=00:14:20"]
  - id: T6
    claim: "Night logistics will be run by the plant, with its own vans."
    voice: participant
    status: voiced
    belt: md
    kind: statement
    feeds: [fn-logistics]
    cites: ["s3#t=00:16:05"]
  - id: T7
    claim: "Nobody on the board carries the loss when baked dough is not ordered."
    voice: ai
    status: ai_variant
    belt: m
    kind: problem
    of: position
    feeds: [gap-risk]
    cites: ["s3#t=00:17:40"]
  - id: T8
    claim: "Will the bank lease equipment to a cooperative that has no history?"
    voice: participant
    status: voiced
    belt: mk
    kind: question
    feeds: [place-bank]
    cites: ["s3#t=00:22:05"]
  - id: T9
    claim: "Five of the forty independent bakeries would pledge a weekly volume if our dough costs less per tonne than their own."
    voice: participant
    status: assumption
    belt: md
    kind: statement
    about: [place-mills, fn-dough]
    cites: ["s3#t=00:26:30"]
hypotheses:
  - id: H1
    assumes: "Five bakeries will pledge a weekly volume if dough costs less per tonne than their own."
    action: "Offer a pledge form to twelve bakeries."
    observe: "Number of signed pledge forms."
    status: untested
    targets: [place-mills, fn-dough]
    raised_in: 2
  - id: H2
    assumes: "The bank leases to a cooperative backed by member pledges."
    action: "Ask the bank once the pledges are in hand."
    observe: "The bank's terms."
    status: untested
    targets: [place-bank]
    raised_in: 2
state:
  version: "2.0"
  difficulty: "session 1 left the plant without a payer"
  accepted: []
  open: ["K1", "K2", "T7", "H1", "H2"]
