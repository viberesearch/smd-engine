theses:
  - id: T1
    claim: "Session 1 left the plant without a payer."
    grounds: "We agreed a shared plant makes sense, and nobody said who pays for it."
    voice: group
    status: voiced
    belt: md
    kind: difficulty
    feeds: [p-reflect]
    cites: ["s3#t=00:03:20"]
